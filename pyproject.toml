[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashunstander"
version = "0.1.3"
requires-python = ">=3.13"
dependencies = ["PySide6>=6.12,<7", "openai>=3,<4", "keyring>=25,<26", "tiktoken>=0.14,<1", "pywin32>=312; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pyinstaller>=6,<7"]

[project.scripts]
flashunstander = "flashunstander.app:main"

[tool.setuptools.package-data]
flashunstander = ["qml/*.qml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
